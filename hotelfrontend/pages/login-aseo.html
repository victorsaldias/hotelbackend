<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema Hotel</title>

<link rel="stylesheet" href="../css/aseo.css">

</head>

<body>

<div class="login-container">
    <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png">

    <input type="email" id="loginCorreo" placeholder="Correo" required>

    <button class="btn-login" onclick="loginEmpleado()">Ingresar</button>
</div>

<script src="../js/loginEmpleado.js"></script>

</body>
</html>
