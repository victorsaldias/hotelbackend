<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Recepcionista</title>

    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>

        <ul class="menu">
            <li class="active" onclick="location.href='recepcionista.html'">
                <i class="fa fa-bed"></i> Reservas
            </li>
            <li onclick="location.href='perfil-recepcionista.html'">
                <i class="fa fa-user"></i> Mi Perfil
            </li>
            <li onclick="location.href='../index.html'" style="color:#ff6b6b;">
                <i class="fa fa-sign-out-alt"></i> Cerrar Sesión
            </li>
        </ul>
    </aside>

    <main class="content">

        <header class="topbar">
            <h2>Panel del Recepcionista</h2>
            <span>Recepcionista</span>
        </header>

        <div class="actions">
            <input type="text" id="buscarReserva" class="search" placeholder="Buscar reserva por nombre, apellido, RUT o habitación...">
            <button class="btn-add" onclick="abrirModalReserva()">Registrar Reserva</button>
        </div>

        <div class="table-container">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>RUT</th>
                        <th>Correo</th>
                        <th>Habitación</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaReservas"></tbody>
            </table>
        </div>

    </main>
</div>

<div class="modal" id="modalReserva">
    <div class="modal-content">

        <h3 id="tituloModal">Registrar Reserva</h3>

        <div class="form-grid">

            <h4 style="grid-column: span 2;">Datos del Cliente</h4>

            <input type="text" id="reservaNombre" placeholder="Nombre" required>
            <input type="text" id="reservaApellido" placeholder="Apellido" required>

            <input type="text" id="reservaRut" placeholder="RUT" required>
            <input type="email" id="reservaCorreo" placeholder="Correo" required>

            <h4 style="grid-column: span 2; margin-top: 10px;">Datos de la Reserva</h4>

            <input type="number" id="reservaHabitacion" placeholder="N° Habitación" required>

            <label>Fecha Entrada:</label>
            <input type="date" id="reservaEntrada" required>

            <label>Fecha Salida:</label>
            <input type="date" id="reservaSalida" required>

            <select id="reservaEstado">
                <option value="pendiente">Pendiente</option>
                <option value="confirmada">Confirmada</option>
                <option value="cancelada">Cancelada</option>
            </select>

        </div>

        <div class="modal-actions">
            <button class="btn-save">Guardar</button>
            <button class="btn-cancel" onclick="cerrarModalReserva()">Cerrar</button>
        </div>

    </div>
</div>

</body>
</html>
