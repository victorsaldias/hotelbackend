<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>

        <ul class="menu">
            <li class="active" onclick="location.href='dashboard-admin.html'">
                <i class="fa fa-users"></i> Registrar Empleados
            </li>
            <li onclick="location.href='reportes.html'">
                <i class="fa fa-chart-line"></i> Reportes
            </li>
            <li onclick="location.href='perfil.html'">
                <i class="fa fa-user"></i> Mi Perfil
            </li>
            <li onclick="cerrarSesion()" style="color:#ff6b6b;">
                <i class="fa fa-right-from-bracket"></i> Cerrar Sesión
            </li>
        </ul>
    </aside>

    <div class="overlay-sidebar" onclick="toggleSidebar()"></div>

    <main class="content">

        <header class="topbar">
            <button class="btn-menu" onclick="toggleSidebar()">
                <i class="fa fa-bars"></i>
            </button>

            <h2>Panel de Administración</h2>

            <div class="topbar-right">
                <span id="adminName">Administrador</span>
            </div>
        </header>

        <div class="actions">
            <input type="text" id="buscar" placeholder="Buscar empleado..." class="search">
            <button class="btn-add" onclick="nuevoEmpleado()" >Agregar Empleado</button>
        </div>

        <div class="table-container">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>RUT</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="listaEmpleados"></tbody>
            </table>
        </div>

    </main>
</div>

<div class="modal" id="modalEmpleado">
    <div class="modal-content">
        <h3 class="modal-title">Registrar Empleado</h3>

        <div class="form-grid">

            <input type="text" id="empNombre" placeholder="Nombre">
            <input type="text" id="empApellido" placeholder="Apellido">
            <input type="text" id="empRut" placeholder="RUT">
            <input type="email" id="empCorreo" placeholder="Correo">

            <!-- Contraseña (solo al crear) -->
            <div id="groupPassword">
                <input type="password" id="empPassword" placeholder="Contraseña">
            </div>

            <!-- Rol del empleado -->
            <select id="empRol">
                <option value="1">Administrador</option>
                <option value="2">Recepcionista</option>
                <option value="3">Personal de aseo</option>
            </select>

            <!-- Estado del empleado -->
            <select id="empEstado">
                <option value="1">Activo</option>
                <option value="2">Ocupado</option>
                <option value="3">Libre</option>
                <option value="4">Suspendido</option>
            </select>

        </div>

        <div class="modal-actions">
            <button id="btnGuardar" class="btn-save" onclick="guardarEmpleado()">Registrar</button>
            <button class="btn-cancel" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>
</div>

<script src="../js/admin.js"></script>

<script>
function toggleSidebar() {
    document.querySelector(".sidebar").classList.toggle("show-sidebar");
    document.querySelector(".overlay-sidebar").classList.toggle("active");
}
</script>

</body>
</html>
