<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>

<body>

<div class="layout">

   
    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>
        <ul class="menu">
    <li onclick="location.href='dashboard-admin.html'">
        <i class="fa fa-users"></i>
        Registrar Empleados
    </li>

    <li onclick="location.href='reportes.html'">
        <i class="fa fa-chart-line"></i>
        Reportes
    </li>

    <li class="active" onclick="location.href='perfil.html'">
        <i class="fa fa-user"></i>
        Mi Perfil
    </li>

    <li onclick="cerrarSesion()" style="color:#ff6b6b;">
        <i class="fa fa-right-from-bracket"></i>
        Cerrar Sesión
    </li>
</ul>


    </aside>

   
    <main class="content">
        
        <header class="topbar">
            <h2>Mi Perfil</h2>
            <span id="perfilNombreHeader">Administrador</span>
        </header>

        <div class="perfil-container">

            <div class="perfil-card">
                <h3>Información Personal</h3>

                <div class="perfil-grid">

                    <label>RUT:</label>
                    <input type="text" id="perfilRut" disabled>

                    <label>Nombre:</label>
                    <input type="text" id="perfilNombre" disabled>

                    <label>Apellido:</label>
                    <input type="text" id="perfilApellido" disabled>

                    <label>Rol:</label>
                    <input type="text" id="perfilRol" disabled>

                    <label>Estado:</label>
                    <input type="text" id="perfilEstado" disabled>

                    <label>Sucursal:</label>
                    <input type="text" id="perfilSucursal" disabled>

                    <label>Nueva contraseña:</label>
                    <input type="password" id="perfilPass" disabled placeholder="">
                </div>

                <div class="perfil-actions">
                    <button id="btnEditar" class="btn-save" onclick="activarEdicion()">Editar</button>
                    <button id="btnGuardar" class="btn-save" onclick="guardarPerfil()" style="display:none">Guardar</button>
                    <button id="btnCancelar" class="btn-cancel" onclick="cancelarEdicion()" style="display:none">Cancelar</button>
                </div>

            </div>

        </div>
    </main>

</div>

<script src="../js/perfil.js"></script>

</body>
</html>
