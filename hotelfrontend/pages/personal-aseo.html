<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Personal de Aseo</title>

    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/components.css">

<body>

<div class="layout">

    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>

        <ul class="menu">

                <i class="fa-solid fa-broom"></i> Habitaciones
            </li>
            <li onclick="location.href='perfil-aseo.html'">
                <i class="fa-solid fa-user"></i> Mi Perfil

                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </li>

        </ul>
    </aside>

    <main class="content">

        <header class="topbar">
            <i class="fa-solid fa-bars btn-menu" onclick="toggleMenu()"></i>
            <h2>Personal de Aseo</h2>
            <span id="aseoNombreHeader">Empleado</span>
        </header>

        <section class="habitaciones" id="listaHabitaciones">
            
        </section>

</div>

<div class="overlay-menu" id="overlayMenu"></div>

<script src="../js/menuMovil.js"></script>
