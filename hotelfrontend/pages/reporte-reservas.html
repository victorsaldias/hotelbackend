<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Reservas</title>

    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>

        <ul class="menu">
            <li onclick="location.href='dashboard-admin.html'">
                <i class="fa-solid fa-users"></i> Registrar Empleados
            </li>

            <li class="active" onclick="location.href='reportes.html'">
                <i class="fa-solid fa-chart-line"></i> Reportes
            </li>

            <li onclick="location.href='perfil.html'">
                <i class="fa-solid fa-user"></i> Mi Perfil
            </li>

            <li onclick="logoutEmpleado()">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </li>
        </ul>
    </aside>

    <main class="content">

        <header class="topbar">
            <h2>Reporte de Reservas</h2>
            <span id="perfilNombreHeader"></span>
        </header>

        <div class="table-container">
            <h3>Listado de Reservas</h3>
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>Cliente</th>
                        <th>Habitación</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas"></tbody>
            </table>
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/menuMovil.js"></script>
<script src="../js/reporteReservas.js"></script>
<script src="../js/authStatus.js"></script>
<script src="../js/authGuardEmpleado.js"></script>  


</body>
</html>
