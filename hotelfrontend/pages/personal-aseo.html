<!DOCTYPE html>

    <title>Panel Personal de Aseo</title>
    <link rel="stylesheet" href="../css/aseo.css">

        </div>

        <div class="card">
            <p><strong>Número habitación:</strong> 105</p>
            <p><strong>Estado:</strong> en proceso</p>
            <button class="btn-limpiar">realizar limpieza</button>
        </div>

        <div class="card">
            <p><strong>Número habitación:</strong> 330</p>

        </div>

    </section>

</html>
