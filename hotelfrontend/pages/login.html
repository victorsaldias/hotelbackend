<!doctype html>
<html lang="es">
  <head>
    <title>Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- CSS DEL TEMPLATE (RUTA CORREGIDA) -->
    <link rel="stylesheet" href="../css/styleLogin.css">
  </head>

  <body>

  <section class="ftco-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center mb-5">
          <h2 class="heading-section">Iniciar Sesión</h2>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="wrap">

            <!-- Imagen -->
            <div class="img" style="background-image: url('../img/bg-1.jpg');"></div>

            <div class="login-wrap p-4 p-md-5">
              <div class="d-flex">
                <div class="w-100">
                  <h3 class="mb-4">Bienvenido</h3>
                </div>
              </div>

              <form action="#" class="signin-form">

                <!-- CORREO -->
                <div class="form-group mt-3">
                  <input type="email" id="loginEmail" class="form-control" required>
                  <label class="form-control-placeholder">Correo</label>
                </div>

                <!-- CONTRASEÑA -->
                <div class="form-group">
                  <input id="loginPassword" type="password" class="form-control" required>
                  <label class="form-control-placeholder">Contraseña</label>
                  <span toggle="#loginPassword" class="fa fa-fw fa-eye field-icon toggle-password"></span>
                </div>

                <!-- BOTÓN AMARILLO -->
                <div class="form-group">
                  <button type="button" onclick="login()" 
                    class="form-control rounded submit px-3"
                    style="background:#d8c04c; border:none; color:#fff; font-weight:bold;">
                    Iniciar Sesión
                  </button>
                </div>

              </form>

              <!-- LINK A REGISTRO -->
              <p class="text-center">
                ¿No tienes cuenta? <a href="registro.html" style="color:#d8c04c; font-weight:bold;">Regístrate</a>
              </p>

            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  
  <script src="../js/jquery.min.js"></script>
  <script src="../js/popper.js"></script>
  <script src="../js/bootstrap.minLogin.js"></script>
  <script src="../js/mainLogin.js"></script>

  </body>
</html>
