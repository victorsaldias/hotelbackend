<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<div class="layout">

   
    <aside class="sidebar">
        <h2 class="sidebar-title">Hotel XYZ</h2>

        <ul class="menu">
            <li class="active"><i class="fa fa-users"></i> Empleados</li>
            <li onclick="location.href='perfil.html'">
        <i class="fa fa-user"></i> Mi Perfil
    </li>
        </ul>
    </aside>

    <main class="content">

      
        <header class="topbar">
            <h2>Panel de Administración</h2>
            <span id="adminName">Administrador</span>
        </header>

       
        <div class="actions">
            <input type="text" id="buscar" placeholder="Buscar empleado..." class="search">
            <button class="btn-add" onclick="abrirModal()">Agregar Empleado</button>
        </div>

        
        <div class="table-container">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>RUT</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="listaEmpleados">
                   
                </tbody>
            </table>
        </div>
    </main>
</div>


<div class="modal" id="modalEmpleado">
    <div class="modal-content">
        <h3 class="modal-title">Registrar Empleado</h3>

        <div class="form-grid">
            <input type="text" id="empNombre" placeholder="Nombre">
            <input type="text" id="empApellido" placeholder="Apellido">
            <input type="text" id="empRut" placeholder="RUT">
            <input type="email" id="empCorreo" placeholder="Correo">
            <input type="password" id="empPass" placeholder="Contraseña">

            <select id="empRol">
                <option value="admin">Administrador</option>
                <option value="recepcionista">Recepcionista</option>
                <option value="aseo">Personal de aseo</option>
            </select>
        </div>

        <div class="modal-actions">
            <button id="btnGuardar" class="btn-save" onclick="guardarEmpleado()">Registrar</button>
            <button class="btn-cancel" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>
</div>

<script src="../js/admin.js"></script>

</body>
</html>
